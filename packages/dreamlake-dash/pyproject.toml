[project]
name = "dreamlake-dash"
version = "0.1.0"
description = "DreamLake experiment recording: metrics, tracks, artifacts and run lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ge Yang"}, {name = "Tom Tao"}]
dependencies = ["httpx>=0.27.0", "params-proto>=1.9.0", "rich>=13.0.0"]

[project.optional-dependencies]
auth = ["keyring>=25", "cryptography>=42"]
media = ["numpy>=1.24", "pillow>=10"]
video = ["imageio[ffmpeg]>=2.31", "scikit-image>=0.22"]
dev = ["pytest>=8"]

[project.urls]
Documentation = "https://py.dreamlake.ai/native-experiments"
Source = "https://github.com/fortyfive-labs/dreamlake/tree/main/packages/dreamlake-dash"
Issues = "https://github.com/fortyfive-labs/dreamlake/issues"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
